<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kumpulan Buttons</title>

    <style>
        body {
            background-color: #f5eede;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        main {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        h2 {
            font-size: 20px;
            color: navy;
            font-family: Georgia, serif;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        .button-group .btn {
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn-primary {
            background-color: #007bff;
            color: white;
            border: none;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
            border: none;
        }

        .btn-outline {
            background-color: transparent;
            color: #007bff;
            border: 2px solid #007bff;
        }

        .btn-send {
            background-color: #28a745;
            color: white;
            border: none;
        }

        .btn-primary:hover{
            background-color: red;
        }

        .btn-secondary:hover{
            background-color: blue;
        }

        .btn-outline:hover{
            background-color: yellow;
            color: black;
        }

        .btn-send:hover{
            background-color: purple;
        }


    </style>
</head>

<body>
    <main>
        <h2>Pilihan Menu dan Aksi</h2>

        <div class="button-group">
            <a href="#" class="btn btn-primary">Lihat Proyek</a>
            <a href="#" class="btn btn-secondary">Unduh CV</a>
            <a href="#" class="btn btn-outline">Hubungi Saya</a>
            <a href="#" class="btn btn-send">Kirim Pesan</a>
        </div>
    </main>
    <div></div>
</body>
</html>
