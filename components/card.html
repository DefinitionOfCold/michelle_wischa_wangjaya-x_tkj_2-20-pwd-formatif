<!-- Jika box-sizing tidak diterapkan, maka lebar 320px + padding kiri-kanan (20px + 20px) + border kiri-kanan (2px + 2px) = 364px -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            background-color: #f5eede;
            font-family: Arial, sans-serif;
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            align-content: center;
        }

        .card {
            width: 320px;
            padding: 20px;
            border: 2px solid #260b5e;
            margin: 30px auto;
            background-color: white;
        }

        .card img {
            width: 100%;
            height: 160px;
            display: block;
            margin-bottom: 15px;
            object-fit: cover;
        }

        .card h3 {
            font-size: 18px;
            color: #17597c;
            margin-bottom: 8px;
        }

        .card p {
            font-size: 15px;
            color: #040404;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .card a {
            font-size: 15px;
            color: #fc0a0a;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        footer {
            text-align: center;
            margin-top: 20px;
        }

    </style>
</head>
<body>
    <main>
        <div class="card">
            <img src="../assets/images/TokoOnline.png" alt="Website Toko Online">
            <h3>Hobi & Minat</h3>
            <p>Saya senang membuat desain karakter dan mempelajari sejarah dunia, terutama tokoh dan peristiwa bersejarah.</p>
            <a href="#">Lihat Proyek</a>
        </div>
    </main>

     <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer> 
</body>
</html>
