<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta informasi dokumen dan judul halaman galeri -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <link rel="stylesheet" href="../styles/gallery.css">
</head>
<body>

    <!-- Konten Utama Halaman -->
    <main>

        <!-- Galeri Kegiatan Waktu Luang -->
        <section id="gallery">
            <h2>Yang Dilakukan saat Waktu Luang</h2>

            <div class="gallery">

                <!-- Item Galeri 1 yaitu Membuat Character Design -->
                <article class="gallery-item">
                    <img src="../assets/images/Design.jpg" alt="Proyek 1">
                    <h3 class="short-title">Membuat Character Design</h3>
                </article>

                <!-- Item Galeri 2 yaitu Main Minecraft -->
                <article class="gallery-item">
                    <img src="../assets/images/Minecraft.png" alt="Proyek 1">
                    <h3 class="short-title">Main Minecraft</h3>
                </article>

                <!-- Item Galeri 3 yaitu Belajar Matematika -->
                <article class="gallery-item">
                    <img src="../assets/images/ChiikawaStudying.png" alt="Proyek 1">
                    <h3 class="short-title">Belajar Matematika</h3>
                </article>

                <!-- Item Galeri 4 yaitu Main Badminton -->
                <article class="gallery-item">
                    <img src="../assets/images/Badminton.png" alt="Proyek 1">
                    <h3 class="short-title">Main Badminton</h3>
                </article>

                <!-- Item Galeri 5 yaitu Belajar Menggambar -->
                <article class="gallery-item">
                    <img src="../assets/images/BelajarMenggambar.png" alt="Proyek 1">
                    <h3 class="short-title">Belajar Menggambar</h3>
                </article>

                <!-- Item Galeri 6 yaitu Baca Sejarah -->
                <article class="gallery-item">
                    <img src="../assets/images/Picture.png" alt="Proyek 1">
                    <h3 class="short-title">Baca-baca Sejarah</h3>
                </article>
            </div>
        </section>
    </main>

    <!-- Bagian Footer Halaman untuk kembali ke Beranda -->
    <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>


</body>
</html>
