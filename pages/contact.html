<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta informasi dokumen dan judul halaman kontak -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <style>
        /* Pengaturan dasar halaman dan body */
        body {
            background-color: #f5eede;
            margin: 0px;
            padding: 0px;
            font-family: Arial, sans-serif;
        }

        /* Styling bagian seksi kontak */
        #contact {
            padding: 40px 20px;
        }

        /* Styling kontainer formulir kontak */
        .contact-form {
            width: 400px;
            align-items: center;
            margin: 0 auto;
            padding: 24px;
            background-color: white;
            border-radius: 10px;
            border: 1px solid #b8b8b8;
            box-sizing: border-box;
        }

        /* Styling judul di dalam formulir */
        .contact-form h2 {
            margin-top: 0;
            text-align: center;
            color: #17597c;
        }

        /* Pengaturan kelompok elemen form */

        .form-group {
            margin-bottom: 16px;
        }

        /* Styling label pada formulir */
        .form-group label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: black;
        }

        /* Styling input dan textarea formulir */
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box
        }

        /* Efek fokus pada input dan textarea */
        .form-group input:focus,
        .form-group textarea:focus {
            background-color: #e6f0ff;
            outline: none;
            resize: vertical;
        }

        /* Styling tombol kirim pesan */
        .btn-submit {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #17597c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Efek hover pada tombol kirim pesan */
        .btn-submit:hover {
            background-color: #0f3d5c;
        }

        /* Styling bagian footer halaman */
        footer {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            background-color: #f5eede;
        }

        /* Styling tautan umum pada halaman */
        a {
            color: #17597c;
            text-decoration: none;
            font-weight: bold;
        }

    </style>
</head>
<body>
    <!-- Bagian Konten Kontak Utama -->
    <section id="contact">

        <!-- Formulir Kontak Pengguna -->
        <form class="contact-form">
            <h2>Hubungi Saya</h2>
            <div class="form-group">
                <label for="name">Nama:</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="message">Pesan:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>

            <button type="submit" class="btn-submit">Kirim Pesan</button>
        </form>
    </section>

    <!-- Bagian Footer Halaman untuk Kembali ke Beranda -->
     <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>
    
</body>
</html>
