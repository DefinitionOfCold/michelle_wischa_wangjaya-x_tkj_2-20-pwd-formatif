<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <style>
        body {
            background-color: #f5eede;
            margin: 0px;
            padding: 0px;
            font-family: Arial, sans-serif;
        }

        #contact {
            max-width: 300px;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            border: 2px solid #b8b8b8;
        }

        .contact-form h2 {
            margin-top: 0;
            text-align: center;
            color: #17597c;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: black;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .form-group textarea {
            resize: vertical;
        }

        button {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #17597c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0f3d5c;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            background-color: #f5eede;
        }

        a {
            color: #17597c;
            text-decoration: none;
            font-weight: bold;
        }

    </style>
</head>
<body>
    <section id="contact">
        <form class="contact-form">
            <h2>Hubungi Saya</h2>
            <div class="form-group">
                <label for="name">Nama:</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="message">Pesan:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>

            <button type="submit">Kirim Pesan</button>
        </form>
    </section>

     <footer style="text-align: center; margin-top: 20px; padding: 10px; background-color: #f5eede;">
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>
    
</body>
</html>
